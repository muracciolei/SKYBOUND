name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Con Source = Deploy from a branch, GitHub publica por su cuenta y
      # deploy-pages falla; en ese caso este workflow no tiene que desplegar.
      - name: Check Pages source
        id: pages-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" | jq -r '.build_type // "legacy"')
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          echo "Pages source: $build_type"

      - name: Configure Pages
        if: steps.pages-source.outputs.build_type == 'workflow'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: steps.pages-source.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages-source.outputs.build_type == 'workflow'
        uses: actions/deploy-pages@v5
